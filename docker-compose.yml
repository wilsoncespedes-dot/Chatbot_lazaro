services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lazaro}
      POSTGRES_DB: ${POSTGRES_DB:-lazaro}
      # Sin valor por defecto: compose se niega a arrancar si falta en .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  # Aplica migrations/*.sql una vez por despliegue (lock + una transacción por
  # archivo) antes de que arranque cualquier servicio que use la base.
  migrate:
    build: {context: ., dockerfile: migrations/Dockerfile}
    env_file: [.env]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  telegram_gateway:
    build: {context: ., dockerfile: services/telegram_gateway/Dockerfile}
    env_file: [.env]
    restart: unless-stopped
    environment:
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_BASE_URL: ${WHATSAPP_GRAPH_BASE_URL:-https://graph.facebook.com}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v21.0}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es}
      WHATSAPP_INTERACTIVE_BODY_TEXT: ${WHATSAPP_INTERACTIVE_BODY_TEXT:-Elige una opción:}
      WHATSAPP_WINDOW_HOURS: ${WHATSAPP_WINDOW_HOURS:-24}
    # El sincronizador Gmail lo llama cada pocos segundos: logs con tope de tamaño.
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    ports: ["8001:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  orchestrator:
    build: {context: ., dockerfile: services/orchestrator/Dockerfile}
    env_file: [.env]
    ports: ["8002:8000"]
    # Si falla al arrancar (p. ej. Postgres aún reiniciando), vuelve solo.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  rag:
    build: {context: ., dockerfile: services/rag/Dockerfile}
    env_file: [.env]
    ports: ["8003:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  handover:
    build: {context: ., dockerfile: services/handover/Dockerfile}
    env_file: [.env]
    ports: ["8004:8000"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  mcp_lectura:
    build: {context: ., dockerfile: services/mcp_lectura/Dockerfile}
    env_file: [.env]
    environment:
      RAG_URL: ${RAG_URL:-http://rag:8000}
      MCP_DATABASE_URL: ${MCP_DATABASE_URL:-}
      MCP_DEMO_SEED: ${MCP_DEMO_SEED:-false}
      MCP_MAX_ROWS: ${MCP_MAX_ROWS:-20}
    # Solo red interna: el servidor MCP no se expone a Internet (#74 R8).
    expose: ["8000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rag:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  ollama:
    image: ollama/ollama
    # Opcional: solo arranca con `docker compose --profile ollama up -d`.
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
  timeouts_worker:
    build: {context: ., dockerfile: services/handover/Dockerfile}
    env_file: [.env]
    command: ["python", "vencer_casos.py", "--intervalo"]
    depends_on: [handover]
    restart: unless-stopped
  retention_worker:
    build: {context: ., dockerfile: services/handover/Dockerfile}
    env_file: [.env]
    command: ["python", "purgar_datos.py", "--intervalo"]
    depends_on: [orchestrator, handover]
    restart: unless-stopped
  expiry_notice_worker:
    build: {context: ., dockerfile: services/handover/Dockerfile}
    env_file: [.env]
    command: ["python", "avisar_vencimientos.py", "--intervalo"]
    depends_on: [orchestrator]
    restart: unless-stopped
  # Lee los canales Gmail activos cada GMAIL_SYNC_INTERVAL_SECONDS (5 s) vía
  # POST /channels/{id}/gmail/sync del gateway; sin canales Gmail no hace nada.
  gmail_sync_worker:
    build: {context: ., dockerfile: services/telegram_gateway/Dockerfile}
    env_file: [.env]
    command: ["python", "sincronizar_gmail.py", "--intervalo"]
    depends_on:
      telegram_gateway:
        condition: service_healthy
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  procesar_entrantes:
    build: {context: ., dockerfile: services/orchestrator/Dockerfile}
    env_file: [.env]
    command: ["python", "-m", "orchestrator.workers", "procesar_entrantes"]
    depends_on: [orchestrator]
    restart: unless-stopped
  enviar_salientes:
    build: {context: ., dockerfile: services/orchestrator/Dockerfile}
    env_file: [.env]
    command: ["python", "-m", "orchestrator.workers", "enviar_salientes"]
    depends_on: [orchestrator]
    restart: unless-stopped
volumes:
  pgdata:
  ollama_data:
