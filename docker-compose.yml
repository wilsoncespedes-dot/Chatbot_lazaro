services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lazaro}
      POSTGRES_DB: ${POSTGRES_DB:-lazaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lazaro}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7.2-alpine
  telegram_gateway:
    build: {context: ., dockerfile: services/telegram_gateway/Dockerfile}
    env_file: [.env]
    environment:
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_BASE_URL: ${WHATSAPP_GRAPH_BASE_URL:-https://graph.facebook.com}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v21.0}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es}
      WHATSAPP_INTERACTIVE_BODY_TEXT: ${WHATSAPP_INTERACTIVE_BODY_TEXT:-Elige una opción:}
      WHATSAPP_WINDOW_HOURS: ${WHATSAPP_WINDOW_HOURS:-24}
    ports: ["8001:8000"]
    depends_on: [redis]
  orchestrator:
    build: {context: ., dockerfile: services/orchestrator/Dockerfile}
    env_file: [.env]
    ports: ["8002:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  rag:
    build: {context: ., dockerfile: services/rag/Dockerfile}
    env_file: [.env]
    ports: ["8003:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  handover:
    build: {context: ., dockerfile: services/handover/Dockerfile}
    env_file: [.env]
    ports: ["8004:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  timeouts_worker:
    build: {context: ., dockerfile: services/handover/Dockerfile}
    env_file: [.env]
    command: ["python", "vencer_casos.py", "--intervalo"]
    depends_on: [handover]
    restart: unless-stopped
  retention_worker:
    build: {context: ., dockerfile: services/handover/Dockerfile}
    env_file: [.env]
    command: ["python", "purgar_datos.py", "--intervalo"]
    depends_on: [orchestrator, handover]
    restart: unless-stopped
  expiry_notice_worker:
    build: {context: ., dockerfile: services/handover/Dockerfile}
    env_file: [.env]
    command: ["python", "avisar_vencimientos.py", "--intervalo"]
    depends_on: [orchestrator]
    restart: unless-stopped
volumes:
  pgdata:
