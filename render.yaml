# Blueprint de Render para el chatbot Lázaro.
# Es un artefacto de preparación: no despliega ni crea recursos por sí mismo.
# Sin `plan`: lo elige el humano al crear el Blueprint (R7).
# Todos los recursos comparten región para poder usar la red privada (R6).

envVarGroups:
  - name: lazaro-compartido
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: SERVICE_TOKEN
        generateValue: true

databases:
  - name: lazaro-postgres
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: keyvalue
    name: lazaro-redis
    region: virginia
    ipAllowList: []

  - type: web
    name: telegram-gateway
    runtime: docker
    region: virginia
    dockerContext: .
    dockerfilePath: services/telegram_gateway/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: lazaro-compartido
      - key: DATABASE_URL
        fromDatabase:
          name: lazaro-postgres
          property: connectionString
      - key: CHANNEL_SECRETS_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lazaro-redis
          property: connectionString
      - key: ORCHESTRATOR_URL
        fromService:
          type: web
          name: orchestrator
          property: hostport
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # WhatsApp Cloud API (#43): proveedor de producción de Meta.
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        value: "v21.0"
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: "es"
      - key: WHATSAPP_INTERACTIVE_BODY_TEXT
        value: "Elige una opción:"
      - key: WHATSAPP_WINDOW_HOURS
        value: "24"
      # La frase de aceptación es la misma que valida el orchestrator (#27/#30).
      - key: MESSAGE_GROUPING_ACCEPT_PHRASE
        fromService:
          type: web
          name: orchestrator
          envVarKey: PRIVACY_ACCEPT_PHRASE
      # La frase de rechazo es la misma que valida el orchestrator (#46).
      - key: MESSAGE_GROUPING_REJECT_PHRASE
        fromService:
          type: web
          name: orchestrator
          envVarKey: PRIVACY_REJECT_PHRASE

  - type: web
    name: orchestrator
    runtime: docker
    region: virginia
    dockerContext: .
    dockerfilePath: services/orchestrator/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: lazaro-compartido
      - key: DATABASE_URL
        fromDatabase:
          name: lazaro-postgres
          property: connectionString
      - key: RAG_URL
        fromService:
          type: pserv
          name: rag
          property: hostport
      - key: HANDOVER_URL
        fromService:
          type: pserv
          name: handover
          property: hostport
      - key: TELEGRAM_GATEWAY_URL
        fromService:
          type: web
          name: telegram-gateway
          property: hostport
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: ADMIN_TRUST_PROXY_HEADERS
        value: "true"
      - key: PRIVACY_NOTICE_TEXT
        value: "Lázaro Software es responsable de tus datos personales. Los usamos para atender tu consulta y, si lo necesitas, pasarte con un asesor. Conservamos tus mensajes 30 días y, hasta que pidas su supresión, la memoria de temas pendientes y acuerdos. Puedes pedir esa supresión o ejercer tus derechos por este mismo chat. Para continuar, responde ACEPTO."
      - key: PRIVACY_NOTICE_VERSION
        value: "1.0"
      - key: PRIVACY_ACCEPT_PHRASE
        value: "ACEPTO"
      - key: PRIVACY_REJECT_PHRASE
        value: "NO ACEPTO"
      - key: PRIVACY_TEXT_CONSENT_INSTRUCTION
        value: "Para aceptar, escribe exactamente: {accept}. Si no aceptas, escribe exactamente: {reject}."
      - key: PRIVACY_ACCEPTED_REPLY
        value: "Gracias, registramos tu aceptación. ¿En qué te ayudo?"
      - key: PRIVACY_RETENTION_DAYS
        fromService:
          type: pserv
          name: handover
          envVarKey: PRIVACY_RETENTION_DAYS
      # identidad de clientes (#38)
      - key: IDENTITY_PUBLIC_BASE_URL
        sync: false
      - key: IDENTITY_LINK_SIGNING_KEY
        sync: false
      # harness de IA por estado (#39): apagado hasta configurar vistas de clientes
      - key: HARNESS_ROUTER_ENABLED
        value: "false"
      - key: CLIENT_DATA_ENABLED
        value: "false"
      # memoria por cliente (#40, #57): activada por decisión del dueño (2026-11-14)
      - key: MEMORY_ENABLED
        value: "true"
      # panel de asesores multicanal (#41)
      - key: WHATSAPP_WINDOW_HOURS
        value: "24"
      - key: ADVISOR_WHATSAPP_TEMPLATES
        value: "respuesta_asesor"
      - key: ADVISOR_RETURN_REPLY
        value: "Te devolvemos al asistente virtual. Puedes seguir escribiendo aquí."
      - key: ADVISOR_HISTORY_LOOKBACK_MINUTES
        value: "60"
      - key: ADVISOR_HISTORY_MAX_MESSAGES
        value: "100"
      - key: ADVISOR_PRESENCE_TTL_MINUTES
        value: "15"
      - key: ADVISOR_INBOX_REFRESH_SECONDS
        value: "30"
      # roles que pueden ver y ejecutar la cola de supresión
      # (admin, asesor y/o responsable_datos); el valor por defecto no cambia
      - key: SUPPRESSION_EXECUTOR_ROLES
        value: "admin"
      - key: SUPPRESSION_DEADLINE_BUSINESS_DAYS
        value: "15"
      - key: SUPPRESSION_DUE_SOON_BUSINESS_DAYS
        value: "3"
      - key: SUPPRESSION_QUEUE_EXECUTED_LIMIT
        value: "20"
      - key: SUPPRESSION_DONE_REPLY
        value: "Tu solicitud de supresión de datos fue atendida."
      - key: SUPPRESSION_RESULT_TEMPLATE
        value: "resultado_supresion"
      # notas internas y etiquetas del panel (#50)
      - key: CASE_NOTE_MAX_CHARS
        value: "1000"
      - key: CASE_NOTES_MAX_PER_CASE
        value: "50"
      - key: CASE_TAG_NAME_MAX_CHARS
        value: "40"
      - key: CASE_TAGS_MAX_PER_CASE
        value: "10"
      # respuestas guardadas del panel (#51)
      - key: SAVED_REPLY_TITLE_MAX_CHARS
        value: "80"
      - key: SAVED_REPLY_TEXT_MAX_CHARS
        value: "1000"
      - key: SAVED_REPLIES_MAX
        value: "100"
      # administración y avisos (#42)
      - key: BUSINESS_HOURS_ENABLED
        value: "false"
      - key: BUSINESS_HOURS_START
        value: "06:00"
      - key: BUSINESS_HOURS_END
        value: "21:00"
      - key: BUSINESS_HOURS_DAYS
        value: "1,2,3,4,5,6,7"
      - key: BUSINESS_HOURS_UTC_OFFSET_MINUTES
        value: "-300"
      # asignación de casos (#52): manual | automatica; el panel la sobrescribe
      - key: ASSIGNMENT_MODE
        value: "manual"
      - key: EXPIRY_NOTICE_ENABLED
        value: "true"
      - key: EXPIRY_NOTICE_MAX_ATTEMPTS
        value: "3"
      - key: ADMIN_TEXT_HISTORY_LIMIT
        value: "20"
      - key: ADMIN_METRICS_UNANSWERED_LIMIT
        value: "20"

  - type: pserv
    name: rag
    runtime: docker
    region: virginia
    dockerContext: .
    dockerfilePath: services/rag/Dockerfile
    envVars:
      - fromGroup: lazaro-compartido
      - key: DATABASE_URL
        fromDatabase:
          name: lazaro-postgres
          property: connectionString
      - key: EMBEDDINGS_API_KEY
        sync: false
      - key: EMBEDDINGS_MODEL
        sync: false

  - type: pserv
    name: handover
    runtime: docker
    region: virginia
    dockerContext: .
    dockerfilePath: services/handover/Dockerfile
    envVars:
      - fromGroup: lazaro-compartido
      - key: DATABASE_URL
        fromDatabase:
          name: lazaro-postgres
          property: connectionString
      - key: TELEGRAM_GATEWAY_URL
        fromService:
          type: web
          name: telegram-gateway
          property: hostport
      - key: PRIVACY_RETENTION_DAYS
        value: "30"
      - key: PRIVACY_ACTIVE_CASE_MAX_DAYS
        value: "15"

  - type: worker
    name: timeouts-worker
    runtime: docker
    region: virginia
    dockerContext: .
    dockerfilePath: services/handover/Dockerfile
    dockerCommand: python vencer_casos.py --intervalo
    envVars:
      - fromGroup: lazaro-compartido
      - key: HANDOVER_URL
        fromService:
          type: pserv
          name: handover
          property: hostport

  - type: worker
    name: expiry-notice-worker
    runtime: docker
    region: virginia
    dockerContext: .
    dockerfilePath: services/handover/Dockerfile
    dockerCommand: python avisar_vencimientos.py --intervalo
    envVars:
      - fromGroup: lazaro-compartido
      - key: ORCHESTRATOR_URL
        fromService:
          type: web
          name: orchestrator
          property: hostport
      - key: EXPIRY_NOTICE_INTERVAL_SECONDS
        value: "3600"
      - key: EXPIRY_NOTICE_HTTP_TIMEOUT_SECONDS
        value: "120"

  - type: worker
    name: retention-worker
    runtime: docker
    region: virginia
    dockerContext: .
    dockerfilePath: services/handover/Dockerfile
    dockerCommand: python purgar_datos.py --intervalo
    envVars:
      - fromGroup: lazaro-compartido
      - key: HANDOVER_URL
        fromService:
          type: pserv
          name: handover
          property: hostport
      - key: ORCHESTRATOR_URL
        fromService:
          type: web
          name: orchestrator
          property: hostport
      - key: PRIVACY_PURGE_INTERVAL_SECONDS
        value: "86400"
      - key: PRIVACY_PURGE_HTTP_TIMEOUT_SECONDS
        value: "120"
